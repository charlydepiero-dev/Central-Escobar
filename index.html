    <script>
      // Suppress harmless Vite dev WebSocket HMR connection errors in AI Studio iframe environment
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('ws://') !== -1 || e.message.indexOf('wss://') !== -1)) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason ? String(e.reason.message || e.reason) : '';
        if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('ws://') !== -1 || reason.indexOf('wss://') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);

      // Force clear any cached service worker files so mobile browsers load fresh code immediately
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (names) {
          for (var name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
